name: Public source gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tracked public source
        shell: powershell
        run: |
          .\scripts\Test-PublicSource.ps1 -WorkingTree

      - name: Test public-source fail-closed controls
        shell: powershell
        run: |
          .\scripts\Test-PublicSourceNegativeControls.ps1

      - name: Parse PowerShell source
        shell: powershell
        run: |
          $invalid = @(
            Get-ChildItem -Recurse -File -Filter *.ps1 |
              ForEach-Object {
                $tokens = $null
                $errors = $null
                [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref]$tokens,
                  [ref]$errors
                ) | Out-Null
                if ($errors.Count -gt 0) {
                  [pscustomobject]@{
                    path = $_.FullName
                    errors = @($errors | ForEach-Object Message)
                  }
                }
              }
          )
          if ($invalid.Count -gt 0) {
            $invalid | ConvertTo-Json -Depth 5
            throw 'PowerShell parsing failed.'
          }

      - name: Test remote media network boundary
        shell: powershell
        run: |
          .\scripts\Test-WorkspaceWidgetNetworkBoundary.ps1

      - name: Verify official security baseline
        shell: powershell
        run: |
          .\scripts\Test-OfficialSecurityBaseline.ps1

      - name: Verify registration, localization and motion regressions
        shell: powershell
        run: |
          foreach ($test in @(
            'Test-WorkspaceWidgetExperience.ps1',
            'Test-WorkspaceWidgetRegistrationV5.ps1',
            'Test-WorkspaceWidgetLanguageContrast.ps1',
            'Test-WorkspaceWidgetAppearanceSettings.ps1',
            'Test-WorkspaceWidgetComboBox.ps1',
            'Test-WorkspaceWidgetMotion.ps1',
            'Test-WorkspaceWidgetSharedOpacity.ps1',
            'Test-WorkspaceWidgetStopFeedback.ps1',
            'Test-WorkspaceWidgetMenuLocalization.ps1',
            'Test-WorkspaceWidgetFeedbackLocalization.ps1',
            'Test-WorkspaceWidgetUpgradeProcessGate.ps1',
            'Test-WorkspaceWidgetRepairSafety.ps1',
            'Test-WorkspaceWidgetStateV5Migration.ps1',
            'Test-WorkspaceWidgetProductionControlV5.ps1'
          )) {
            powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File (Join-Path '.\scripts' $test)
            if ($LASTEXITCODE -ne 0) { throw "Modernization regression failed: $test" }
          }

      - name: Build allowlisted development stage
        shell: powershell
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP 'workspace-widget-build'
          $buildOutput = @(
            .\scripts\Build-WorkspaceWidget.ps1 `
            -Version 0.2.0 `
            -OutputRoot $outputRoot `
            -SkipInstaller
          )
          $buildResult = ($buildOutput -join [Environment]::NewLine) |
            ConvertFrom-Json
          if (-not [bool]$buildResult.success) {
            throw 'The development stage build did not report success.'
          }
          $stageManifest = Get-Content -LiteralPath (
            Join-Path $outputRoot 'WorkspaceWidget-0.2.0-manifest.json'
          ) -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not [bool]$stageManifest.toolchain.deterministic) {
            throw 'CI requires the deterministic Roslyn compiler used by Store builds.'
          }
          $verificationOutput = @(
            .\scripts\Test-WorkspaceWidgetRelease.ps1 `
            -Version 0.2.0 `
            -OutputRoot $outputRoot
          )
          $verificationResult = (
            $verificationOutput -join [Environment]::NewLine
          ) | ConvertFrom-Json
          if (-not [bool]$verificationResult.success) {
            $verificationResult | ConvertTo-Json -Depth 8
            throw 'The development stage verification failed.'
          }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\Test-WorkspaceWidgetSupervisorDiagnostics.ps1 `
            -HostPath (Join-Path $buildResult.stageRoot 'WorkspaceWidget.exe')
          if ($LASTEXITCODE -ne 0) {
            throw 'Bounded supervisor failure diagnostics failed.'
          }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\Test-WorkspaceWidgetDescriptorEncoding.ps1 `
            -HostPath (Join-Path $buildResult.stageRoot 'WorkspaceWidget.exe')
          if ($LASTEXITCODE -ne 0) {
            throw 'Supervisor descriptor encoding verification failed.'
          }
          $listener = [System.Net.Sockets.TcpListener]::new(
            [System.Net.IPAddress]::Loopback,
            0
          )
          $listener.Start()
          $probePort = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()
          $probeNonce = [guid]::NewGuid().ToString('N')
          $probeOutput = @(
            & powershell.exe `
              -NoLogo `
              -NoProfile `
              -NonInteractive `
              -ExecutionPolicy Bypass `
              -File (Join-Path $buildResult.stageRoot 'app\WorkspaceWidget.ps1') `
              -ProjectRoot $buildResult.stageRoot `
              -StartupProbe `
              -StartupProbeTarget (Resolve-Path '.\tests\fixtures\node-health-app\server.js') `
              -StartupProbeHealth "http://127.0.0.1:$probePort/health" `
              -StartupProbeArgs "$probePort $probeNonce" `
              -StartupProbeExpectedToken $probeNonce
          )
          $probeExit = $LASTEXITCODE
          $startupProbe = ($probeOutput -join [Environment]::NewLine) |
            ConvertFrom-Json
          Start-Sleep -Milliseconds 300
          $probeProcessLeft = Get-Process `
            -Id ([int]$startupProbe.processId) `
            -ErrorAction SilentlyContinue
          if (
            $probeExit -ne 0 -or
            -not [bool]$startupProbe.success -or
            -not [bool]$startupProbe.expectedTokenMatched -or
            [string]$startupProbe.bundledNodeVersion -ne 'v24.21.0' -or
            $null -ne $probeProcessLeft
          ) {
            $startupProbe | ConvertTo-Json -Depth 8
            throw 'The package-local Node startup/health/cleanup probe failed.'
          }
          $verificationResult | ConvertTo-Json -Depth 8
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\Test-WorkspaceWidgetManagedLifecycle.ps1 `
            -HostPath (Join-Path $buildResult.stageRoot 'WorkspaceWidget.exe') `
            -NodePath (Join-Path $buildResult.stageRoot 'runtime\node\node.exe')
          if ($LASTEXITCODE -ne 0) {
            throw 'Managed server ownership and shutdown verification failed.'
          }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\Test-WorkspaceWidgetV2Lifecycle.ps1 `
            -HostPath (Join-Path $buildResult.stageRoot 'WorkspaceWidget.exe') `
            -PackageHostPath (Join-Path $buildResult.stageRoot 'WorkspaceWidget.exe') `
            -NodePath (Join-Path $buildResult.stageRoot 'runtime\node\node.exe')
          if ($LASTEXITCODE -ne 0) {
            throw 'V2 multi-health and explicit-stop lifecycle verification failed.'
          }
          powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File .\scripts\Test-WorkspaceWidgetLifecycleUi.ps1 `
            -HostPath (Join-Path $buildResult.stageRoot 'WorkspaceWidget.exe')
          if ($LASTEXITCODE -ne 0) {
            throw 'Managed server lifecycle UI verification failed.'
          }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\Test-WorkspaceWidgetStartupIntegration.ps1 `
            -StageRoot $buildResult.stageRoot
          if ($LASTEXITCODE -ne 0) {
            throw 'Direct and package-runner startup integration failed.'
          }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\Test-WorkspaceWidgetManagedLaunchBoundary.ps1 `
            -HostPath (Join-Path $buildResult.stageRoot 'WorkspaceWidget.exe')
          if ($LASTEXITCODE -ne 0) {
            throw 'Managed launch command/path boundary verification failed.'
          }
          $global:LASTEXITCODE = 0
