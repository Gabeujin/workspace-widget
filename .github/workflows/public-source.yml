name: Public source gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tracked public source
        shell: powershell
        run: |
          .\scripts\Test-PublicSource.ps1

      - name: Parse PowerShell source
        shell: powershell
        run: |
          $invalid = @(
            Get-ChildItem -Recurse -File -Filter *.ps1 |
              ForEach-Object {
                $tokens = $null
                $errors = $null
                [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref]$tokens,
                  [ref]$errors
                ) | Out-Null
                if ($errors.Count -gt 0) {
                  [pscustomobject]@{
                    path = $_.FullName
                    errors = @($errors | ForEach-Object Message)
                  }
                }
              }
          )
          if ($invalid.Count -gt 0) {
            $invalid | ConvertTo-Json -Depth 5
            throw 'PowerShell parsing failed.'
          }

      - name: Test remote media network boundary
        shell: powershell
        run: |
          .\scripts\Test-WorkspaceWidgetNetworkBoundary.ps1

      - name: Build allowlisted development stage
        shell: powershell
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP 'workspace-widget-build'
          $buildOutput = @(
            .\scripts\Build-WorkspaceWidget.ps1 `
            -Version 0.1.0 `
            -OutputRoot $outputRoot `
            -SkipInstaller
          )
          $buildResult = ($buildOutput -join [Environment]::NewLine) |
            ConvertFrom-Json
          if (-not [bool]$buildResult.success) {
            throw 'The development stage build did not report success.'
          }
          $verificationOutput = @(
            .\scripts\Test-WorkspaceWidgetRelease.ps1 `
            -Version 0.1.0 `
            -OutputRoot $outputRoot
          )
          $verificationResult = (
            $verificationOutput -join [Environment]::NewLine
          ) | ConvertFrom-Json
          if (-not [bool]$verificationResult.success) {
            $verificationResult | ConvertTo-Json -Depth 8
            throw 'The development stage verification failed.'
          }
          $verificationResult | ConvertTo-Json -Depth 8
          $global:LASTEXITCODE = 0
